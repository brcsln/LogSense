name: LogSense CI
permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get LogSense code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build LogSense Docker image
        run: docker build -t logsense .

      - name: Run automated tests
        run: |
              python -m pip install -r backend/requirements.txt
              python -m pytest

      - name: Start LogSense container
        run: docker run -d --name logsense-ci -p 8000:8000 logsense

      - name: Check LogSense health
        run: |
          sleep 5
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/

      - name: Show LogSense logs on failure
        if: failure()
        run: docker logs logsense-ci || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish LogSense Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag logsense "$IMAGE:latest"
          docker tag logsense "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"