name: LogSense CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get LogSense code
        uses: actions/checkout@v4

      - name: Build LogSense Docker image
        run: docker build -t logsense . 
        
      - name: Start LogSense container
        run: docker run -d --name logsense-ci -p 8000:8000 logsense

      - name: Check LogSense health
        run: |
          sleep 5
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/

      - name: Show LogSense logs on failure
        if: failure()
        run: docker logs logsense-ci